<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangga Pintar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FF;--sur:#fff;--tx:#0F1535;--mut:#4A5380;--bd:#D5DAF2;--ac:#C6F432;--on:#0F1535;--lk:#2F5200;--rd:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1535;--sur:#1B2455;--tx:#F5F7FF;--mut:#B8C2F0;--bd:#2C3977;--lk:#C6F432;--rd:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F1535;--sur:#1B2455;--tx:#F5F7FF;--mut:#B8C2F0;--bd:#2C3977;--lk:#C6F432;--rd:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
.b{min-height:52px;border:0;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;padding:0 20px;cursor:pointer}
.g{background:transparent;border:2px solid var(--bd);color:var(--tx)}
.s{min-height:44px;border-radius:12px;padding:0 14px}
.d{color:var(--rd)}
.c{background:var(--sur);border:2px solid var(--bd);border-radius:20px;padding:16px}
.r{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.w{flex-wrap:wrap}
.m{color:var(--mut);font-size:14px}.k{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mut)}
input,select{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);padding:0 12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--mut)}
.f{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px}.tabs .b{flex:1}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--lk)}
.bd{width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;position:relative}
.gr{display:grid;width:100%;height:100%}
.gr div{padding:3px 4px;font-size:clamp(9px,2.6vw,12px);font-weight:700;color:#0F1535;box-shadow:inset 0 0 0 2px var(--bg);border-radius:6px}
.bd svg{position:absolute;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;background:rgba(5,8,25,.72);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.o{min-height:60px;border-radius:16px;border:2px solid var(--bd);background:var(--sur);text-align:left;padding:0 16px;font-size:18px;font-weight:700;cursor:pointer}
.ok{border-color:#2DD4A7;background:rgba(45,212,167,.2)}.no{border-color:var(--rd)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-75%) scale(.92,1.12)}100%{transform:translateY(0) scale(1,1)}}.hop{animation:hop .3s ease-out}
.cf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const M={mtk:['Matematika','#FF6B5E'],indo:['B. Indonesia','#4CC9F0'],ipa:['IPA','#2DD4A7'],ips:['IPS','#FFB020'],ing:['B. Inggris','#9B7BFF'],pkn:['PPKn','#F472B6']};
const MK=Object.keys(M),KL={'12':'Kelas 1-2','34':'Kelas 3-4','56':'Kelas 5-6'};
const B6={up:{3:14,8:17,21:32},dn:{27:7,35:19,30:24}};
const B10={up:{4:25,9:31,21:42,28:84,51:67,72:91},dn:{17:7,54:34,62:19,64:60,87:36,93:73,95:75,98:79}};
let D={students:[],qs:[]},TOKEN=null;
async function api(path,method,body){const r=await fetch('/api'+path,{method:method||'GET',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Terjadi kesalahan');}return r.json();}
async function load(){D=await api('/state');if(typeof S!=='undefined'&&S.user)S.user=D.students.find(x=>x.id===S.user.id)||S.user;}
async function mut(fn){try{await fn();await load();render();}catch(e){alert(e.message);}}
async function goHome(){S.view='home';G=null;try{await load();}catch(e){}render();}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
let S={view:'login',role:null,user:null,tab:'siswa',filter:'all',err:''},G=null;
const acc=st=>st.n?Math.round(st.c/st.n*100):0;
const dot=m=>`<i class="dot" style="background:${M[m][1]}"></i>`;

function render(){const a=$('app');a.innerHTML=({login:vLogin,home:vHome,setup:vSetup,game:vGame,teacher:vTeacher})[S.view]();}
function logout(){TOKEN=null;S={view:'login',role:null,user:null,tab:'siswa',filter:'all',err:''};G=null;render();}
/* ---------- LOGIN ---------- */
function vLogin(){
 const st=D.students.map(s=>`<button class="b g" onclick="loginS('${s.id}')">${esc(s.name)} <span class="m">· ${KL[s.kelas]}</span></button>`).join('')||'<p class="m">Belum ada siswa. Minta guru menambahkannya.</p>';
 return `<h1 style="font-size:44px;line-height:1.02;margin-top:24px">Naik tangga,<br>sambil <span style="color:var(--lk)">belajar.</span></h1>
 <p class="m">Pilih peran untuk masuk.</p>
 ${S.role===null?`<button class="b" onclick="S.role='s';render()">Saya Siswa</button><button class="b g" onclick="S.role='t';render()">Saya Guru</button>`:''}
 ${S.role==='s'?`<div class="k">PILIH NAMAMU</div><div class="f">${st}</div><div class="c f"><div class="k">SISWA BARU</div><div><label for="rn">Tulis namamu</label><input id="rn" maxlength="16" placeholder="Nama"></div><div><label for="rk">Kelas</label><select id="rk">${Object.entries(KL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><button class="b" onclick="regS()">Daftar dan masuk</button></div><button class="b g s" onclick="S.role=null;render()">Kembali</button>`:''}
 ${S.role==='t'?`<div class="c f"><div><label for="pin">PIN guru</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"></div>${S.err?`<div class="d">${S.err}</div>`:''}<button class="b" onclick="loginT()">Masuk</button><div class="m">PIN awal diatur di file .env (bisa diganti di tab Laporan).</div></div><button class="b g s" onclick="S.role=null;S.err='';render()">Kembali</button>`:''}`;}
async function regS(){const n=$('rn').value.trim();if(!n)return;try{const r=await api('/students','POST',{name:n,kelas:$('rk').value});await load();loginS(r.id);}catch(e){alert(e.message);}}
function loginS(id){S.user=D.students.find(s=>s.id===id);S.view='home';render();}
async function loginT(){try{const r=await api('/teacher/login','POST',{pin:$('pin').value});TOKEN=r.token;await load();S.view='teacher';S.err='';}catch(e){S.err=e.message;}render();}
/* ---------- SISWA ---------- */
function vHome(){const u=S.user,st=u.st;
 const by=MK.map(m=>{const b=st.by[m]||{n:0,c:0};const p=b.n?Math.round(b.c/b.n*100):0;return `<div><div class="r sp m"><span>${dot(m)}${M[m][0]}</span><span>${b.n?p+'%':'-'}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 return `<div class="r sp"><div><div class="k">HALO</div><h2 style="font-size:32px">${esc(u.name)}</h2><div class="m">${KL[u.kelas]}</div></div><button class="b g s" onclick="logout()">Keluar</button></div>
 <div class="r"><div class="c" style="flex:1"><h3 style="font-size:28px">${st.g}</h3><div class="m">Main</div></div><div class="c" style="flex:1"><h3 style="font-size:28px">${st.w}</h3><div class="m">Menang</div></div><div class="c" style="flex:1"><h3 style="font-size:28px">${acc(st)}%</h3><div class="m">Akurasi</div></div></div>
 <div class="c f"><div class="k">PENGUASAAN PER MAPEL</div>${by}</div>
 <button class="b" style="min-height:64px;font-size:20px" onclick="openSetup()">Main sekarang</button>`;}
function cfg(){return G.N===6?B6:B10}
let AC=null,MUTE=false;try{MUTE=localStorage.getItem('tpm')==='1'}catch(e){}
function tone(f,d,t,v,at){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(at||0);o.type=t||'sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const SFX={hop:()=>tone(520+Math.random()*120,.12,'triangle',.12),dice:()=>[0,1,2,3].forEach(i=>tone(300+i*90,.06,'square',.05,i*.07)),ok:()=>[523,659,784].forEach((f,i)=>tone(f,.18,'sine',.15,i*.09)),no:()=>[300,220].forEach((f,i)=>tone(f,.22,'sawtooth',.07,i*.14)),up:()=>[392,494,587,784].forEach((f,i)=>tone(f,.14,'triangle',.14,i*.08)),down:()=>[600,480,380,280,200].forEach((f,i)=>tone(f,.12,'sawtooth',.06,i*.07)),win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.12))};
function toggleMute(){MUTE=!MUTE;try{localStorage.setItem('tpm',MUTE?'1':'0')}catch(e){}render();}
const COL=['#C6F432','#FF8A5B','#4CC9F0','#F472B6'];
const FACES=['<circle cx="14" cy="17" r="2.6"/><circle cx="26" cy="17" r="2.6"/><path d="M13 25q7 6 14 0" fill="none" stroke="#0F1535" stroke-width="2.4" stroke-linecap="round"/>','<rect x="9" y="14" width="10" height="7" rx="2"/><rect x="21" y="14" width="10" height="7" rx="2"/><path d="M14 27h12" stroke="#0F1535" stroke-width="2.4" stroke-linecap="round"/>','<circle cx="14" cy="16" r="3"/><circle cx="26" cy="16" r="3"/><circle cx="20" cy="27" r="3.4" fill="none" stroke="#0F1535" stroke-width="2.4"/>','<circle cx="14" cy="17" r="2.6"/><path d="M22 17h7" stroke="#0F1535" stroke-width="2.6" stroke-linecap="round"/><path d="M13 25q7 6 14 0" fill="none" stroke="#0F1535" stroke-width="2.4" stroke-linecap="round"/>'];
const face=(f,c)=>`<svg viewBox="0 0 40 40" width="100%" height="100%" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="${c}" stroke="#0F1535" stroke-width="3"/><g fill="#0F1535">${FACES[f]}</g></svg>`;
function openSetup(){const u=S.user;S.setup={mode:'bot',n:2,players:[{name:u.name,face:0,link:u.id},{name:'Teman 1',face:1,link:''},{name:'Teman 2',face:2,link:''},{name:'Teman 3',face:3,link:''}]};S.view='setup';render();}
function syncSetup(){const s=S.setup;if(!s)return;s.players.forEach((p,i)=>{const e=$('pn'+i);if(e)p.name=e.value;const l=$('pl'+i);if(l)p.link=l.value;});}
function setMode(m){syncSetup();S.setup.mode=m;render();}
function setN(n){syncSetup();S.setup.n=n;render();}
function setFace(i,f){syncSetup();S.setup.players[i].face=f;render();}
function setLink(i){syncSetup();const p=S.setup.players[i];if(p.link)p.name=D.students.find(x=>x.id===p.link).name;render();}
function vSetup(){const s=S.setup,fr=s.mode==='friend',n=fr?s.n:1;
 const cards=s.players.slice(0,n).map((p,i)=>`<div class="c f"><div class="r"><div style="width:52px;height:52px;flex:none">${face(p.face,COL[i])}</div><div style="flex:1"><label for="pn${i}">${i===0?'Pemain 1 (kamu)':'Pemain '+(i+1)}</label><input id="pn${i}" maxlength="16" value="${esc(p.name)}"></div></div>
 <div class="k">PILIH KARAKTER</div><div class="r">${[0,1,2,3].map(x=>`<button class="b s ${p.face===x?'':'g'}" style="min-height:52px;padding:0;width:56px" aria-label="Karakter ${x+1}" onclick="setFace(${i},${x})"><span style="display:block;width:34px;height:34px;margin:auto">${face(x,COL[i])}</span></button>`).join('')}</div>
 ${fr&&i>0?`<div><label for="pl${i}">Hubungkan ke siswa terdaftar (skor tercatat)</label><select id="pl${i}" onchange="setLink(${i})"><option value="">Tamu</option>${D.students.filter(x=>x.id!==S.user.id).map(x=>`<option value="${x.id}" ${p.link===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:''}</div>`).join('');
 return `<div class="r sp"><h2 style="font-size:30px">Atur Permainan</h2><button class="b g s" onclick="S.view='home';render()">Kembali</button></div>
 <div class="k">MODE</div><div class="tabs"><button class="b s ${fr?'g':''}" onclick="setMode('bot')">Lawan komputer</button><button class="b s ${fr?'':'g'}" onclick="setMode('friend')">Dengan teman</button></div>
 ${fr?`<div class="k">JUMLAH PEMAIN</div><div class="tabs">${[2,3,4].map(x=>`<button class="b s ${s.n===x?'':'g'}" onclick="setN(${x})">${x} pemain</button>`).join('')}</div><p class="m" style="margin:0">Mode teman memakai satu perangkat secara bergantian. Soal dan papan mengikuti kelasmu (${KL[S.user.kelas]}).</p>`:''}
 ${cards}<button class="b" style="min-height:64px;font-size:20px" onclick="startGame()">Mulai</button>`;}
function startGame(){syncSetup();const s=S.setup,fr=s.mode==='friend',n=fr?s.n:1,N=S.user.kelas==='12'?6:10;
 const pl=s.players.slice(0,n).map((p,i)=>({name:(p.name||'').trim()||'Pemain '+(i+1),face:p.face,color:COL[i],link:i===0?S.user.id:(p.link||''),pos:1,score:0}));
 if(!fr)pl.push({name:'Komputer',face:1,color:COL[1],link:'',bot:true,pos:1,score:0});
 G={N,players:pl,turn:0,log:'Lempar dadu untuk mulai!',q:null,busy:false,over:null,dice:'-'};S.view='game';render();}
function cellN(r,c){const rb=G.N-1-r;return rb*G.N+(rb%2===0?c+1:G.N-c);}
function ctr(n){const N=G.N,r=Math.floor((n-1)/N);let c=(n-1)%N;if(r%2)c=N-1-c;return[c*100+50,(N-1-r)*100+50]}
function ladder(a,b){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,o=G.N===6?14:11,nx=-uy*o,ny=ux*o,st=G.N===6?36:28;let s='';
 for(const[w,c]of[[G.N===6?8:7,'#0F1535'],[G.N===6?4:3,'#fff']]){s+=`<line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;for(let k=1;k*st<L-8;k++){const px=x1+ux*k*st,py=y1+uy*k*st;s+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`}}return s;}
function snake(a,b){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*40,ny=dx/L*40,d=`M${x1} ${y1} C${x1+dx*.3+nx} ${y1+dy*.3+ny} ${x1+dx*.7-nx} ${y1+dy*.7-ny} ${x2} ${y2}`,w=G.N===6?14:11;
 return `<path d="${d}" stroke="#0F1535" stroke-width="${w+5}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#E5484D" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${w*2} ${w}"/><circle cx="${x1}" cy="${y1}" r="${w*1.1}" fill="#E5484D" stroke="#0F1535" stroke-width="4"/><circle cx="${x1-5}" cy="${y1-3}" r="3" fill="#fff"/><circle cx="${x1+5}" cy="${y1-3}" r="3" fill="#fff"/>`;}
const OFF=[[-18,-18],[18,-18],[-18,18],[18,18]];
function pawn(i,pos){const N=G.N,[x,y]=ctr(pos),P=G.players[i];return `<div id="pw${i}" style="position:absolute;width:${40/N}%;aspect-ratio:1;left:${(x+OFF[i][0])/N}%;top:${(y+OFF[i][1])/N}%;transform:translate(-50%,-50%);z-index:2;pointer-events:none"><div style="width:100%;height:100%">${face(P.face,P.color)}</div></div>`;}
function movePawn(i,pos,mode){const el=$('pw'+i);if(!el)return;const N=G.N,[x,y]=ctr(pos),t=mode==='slide'?'.9s':'.28s';el.style.transition=`left ${t} ease-in-out,top ${t} ease-in-out`;el.style.left=(x+OFF[i][0])/N+'%';el.style.top=(y+OFF[i][1])/N+'%';if(mode==='hop'){SFX.hop();const n=el.firstElementChild;n.classList.remove('hop');void n.offsetWidth;n.classList.add('hop');}}
function setLog(t){G.log=t;const e=$('log');if(e)e.textContent=t;}
function vGame(){const N=G.N,c=cfg(),cur=G.players[G.turn];let cells='',ov='';
 for(let r=0;r<N;r++)for(let k=0;k<N;k++){const n=cellN(r,k);cells+=`<div style="background:${M[MK[n%6]][1]}">${n}</div>`}
 for(const a in c.up)ov+=ladder(+a,c.up[a]);for(const a in c.dn)ov+=snake(+a,c.dn[a]);
 const mine=!cur.bot&&!G.busy&&!G.over;
 return `<div class="r sp"><button class="b g s" onclick="goHome()">Keluar</button><div class="r"><span style="width:32px;height:32px;display:block">${face(cur.face,cur.color)}</span><h2 style="font-size:20px">Giliran ${esc(cur.name)}</h2></div><button class="b g s" onclick="toggleMute()">${MUTE?'Suara off':'Suara on'}</button></div>
 <div class="r w">${G.players.map((p,i)=>`<div class="c" style="flex:1;min-width:76px;padding:8px 10px;border-color:${i===G.turn?'var(--lk)':'var(--bd)'}"><div class="r" style="gap:6px"><span style="width:20px;height:20px;display:block;flex:none">${face(p.face,p.color)}</span><span class="m" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span></div><h3>${p.score}</h3></div>`).join('')}</div>
 <div class="bd"><div class="gr" style="grid-template-columns:repeat(${N},1fr);grid-template-rows:repeat(${N},1fr)">${cells}</div><svg viewBox="0 0 ${N*100} ${N*100}" aria-hidden="true">${ov}</svg>${G.players.map((p,i)=>pawn(i,p.pos)).join('')}</div>
 <div id="log" class="m" style="text-align:center;min-height:22px">${esc(G.log)}</div>
 <div class="r"><div class="c" style="width:76px;height:76px;display:flex;align-items:center;justify-content:center;padding:0"><h2 id="dice" style="font-size:40px">${G.dice}</h2></div><button class="b" style="flex:1;min-height:76px;font-size:20px;opacity:${mine?1:.5}" ${mine?'':'disabled'} onclick="play()">${mine?'Lempar dadu, '+esc(cur.name):'Lempar dadu'}</button></div>
 <div class="r w m" style="justify-content:center">${MK.map(m=>`<span>${dot(m)}${M[m][0]}</span>`).join('')}</div>
 ${G.q?vQ():''}${G.over?vOver():''}`;}
function pickQ(t){const m=MK[t%6],k=S.user.kelas;let p=D.qs.filter(x=>x.m===m&&x.k===k);if(!p.length)p=D.qs.filter(x=>x.m===m);if(!p.length)p=D.qs;return p[Math.random()*p.length|0];}
async function play(){if(G.busy||G.over)return;const g0=G,w=G.turn,P=G.players[w],d=1+(Math.random()*6|0),last=G.N*G.N;G.busy=true;G.dice=d;G.log=P.name+' mendapat dadu '+d+'.';SFX.dice();render();await sleep(450);if(G!==g0)return;
 let p=P.pos,dir=1;for(let i=0;i<d;i++){if(p+dir>last)dir=-1;p+=dir;movePawn(w,p,'hop');await sleep(340);if(G!==g0)return;}
 P.pos=p;if(p===last)return finish(w);await sleep(150);if(G!==g0)return;
 const q=pickQ(p);G.q={q,t:p,w,sel:null};render();if(P.bot){await sleep(1100);if(G===g0)answer(Math.random()<.6?q.a:(q.a+1)%3);}}
function vQ(){const{q,sel}=G.q,m=M[q.m],c=cfg(),t=G.q.t,P=G.players[G.q.w],hint=c.up[t]?`Kaki tangga! Jawab benar untuk naik ke ${c.up[t]}.`:c.dn[t]?`Kepala ular! Jawab benar agar tidak turun.`:'Jawab benar untuk +10 poin.';
 return `<div class="ov"><div class="sh"><div class="r sp"><span class="k">${dot(q.m)}${m[0].toUpperCase()}</span><span class="m">${P.bot?'Komputer menjawab':'Giliran '+esc(P.name)}</span></div><div class="m">${hint}</div><h2 style="font-size:32px;margin:6px 0">${esc(q.q)}</h2>
 ${q.o.map((o,i)=>`<button class="o ${sel!==null?(i===q.a?'ok':i===sel?'no':''):''}" ${sel!==null||P.bot?'disabled':''} onclick="answer(${i})">${'ABC'[i]}. ${esc(o)}</button>`).join('')}
 ${sel!==null?`<div class="c"><b>${sel===q.a?'Benar!':'Belum tepat.'}</b> ${esc(q.e||'')}</div>${P.bot?'':'<button class="b" onclick="after()">Lanjut</button>'}`:''}</div></div>`;}
async function answer(i){if(!G.q||G.q.sel!==null)return;const g0=G,{q,w}=G.q,ok=i===q.a,P=G.players[w];G.q.sel=i;G.q.ok=ok;ok?SFX.ok():SFX.no();
 if(P.link)api('/answers','POST',{studentId:P.link,questionId:q.id,subject:q.m,correct:ok}).catch(()=>{});
 render();if(P.bot){await sleep(1500);if(G===g0)after();}}
async function after(){const g0=G,{t,w,ok}=G.q,c=cfg(),P=G.players[w],last=G.N*G.N;G.q=null;let p=t,mode=null;
 if(ok){P.score+=10;if(c.up[t]){p=c.up[t];mode='slide';G.log=P.name+' naik tangga ke petak '+p+'!';}else G.log='Benar! '+P.name+' +10 poin.';}
 else{if(c.dn[t]){p=c.dn[t];mode='slide';G.log=P.name+' turun ular ke petak '+p+'.';}else if(!c.up[t]){p=Math.max(1,t-1);mode=p!==t?'hop':null;G.log='Salah, '+P.name+' mundur satu petak.';}else G.log='Salah, '+P.name+' tidak naik tangga.';}
 G.busy=true;render();
 if(mode){await sleep(500);if(G!==g0)return;if(mode==='slide')(p>t?SFX.up:SFX.down)();movePawn(w,p,mode);await sleep(mode==='slide'?1000:400);if(G!==g0)return;}
 P.pos=p;if(p===last)return finish(w);
 G.turn=(w+1)%G.players.length;G.busy=false;render();
 if(G.players[G.turn].bot){await sleep(700);if(G===g0)play();}}
function finish(w){G.players.forEach((p,i)=>{if(p.link)api('/games','POST',{studentId:p.link,won:i===w}).catch(()=>{});});SFX.win();G.over={w};G.q=null;G.busy=false;render();}
function vOver(){const W=G.players[G.over.w];const cf=Array.from({length:44},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${['#C6F432','#FF6B5E','#4CC9F0','#FFB020','#9B7BFF','#F472B6'][i%6]};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*1.5}s"></i>`).join('');return `<div class="ov"><div aria-hidden="true" style="position:fixed;inset:0;overflow:hidden;pointer-events:none">${cf}</div><div class="sh" style="text-align:center"><div class="k">PERMAINAN SELESAI</div><div style="width:84px;height:84px;margin:0 auto;animation:hop .7s ease-out infinite">${face(W.face,W.color)}</div><h1 style="font-size:40px">${esc(W.name)} menang!</h1><p class="m">${G.players.map(p=>esc(p.name)+' '+p.score).join(' · ')}</p><button class="b" onclick="startGame()">Main lagi</button><button class="b g" onclick="S.view='setup';render()">Ubah pemain</button><button class="b g" onclick="goHome()">Beranda</button></div></div>`;}
/* ---------- GURU ---------- */
function vTeacher(){const t=S.tab;
 return `<div class="r sp"><div><div class="k">MODE GURU</div><h2 style="font-size:30px">Kelola Kelas</h2></div><button class="b g s" onclick="logout()">Keluar</button></div>
 <div class="tabs">${[['siswa','Siswa'],['soal','Soal'],['lap','Laporan']].map(([k,l])=>`<button class="b s ${t===k?'':'g'}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>`+({siswa:tSiswa,soal:tSoal,lap:tLap})[t]();}
function tSiswa(){return `<div class="c f"><div class="k">TAMBAH SISWA</div><div><label for="nn">Nama</label><input id="nn" placeholder="Nama siswa"></div><div><label for="nk">Kelas</label><select id="nk">${Object.entries(KL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="b" onclick="addS()">Tambah siswa</button></div>
 ${D.students.map(s=>`<div class="c r sp w"><div><b>${esc(s.name)}</b><div class="m">${KL[s.kelas]} · ${s.st.g} main · akurasi ${acc(s.st)}%</div></div><div class="r"><button class="b g s" onclick="resetS('${s.id}')">Reset</button><button class="b g s d" onclick="delS('${s.id}')">Hapus</button></div></div>`).join('')||'<p class="m">Belum ada siswa.</p>'}`;}
function addS(){const n=$('nn').value.trim();if(!n)return;mut(()=>api('/students','POST',{name:n,kelas:$('nk').value}));}
function delS(id){if(confirm('Hapus siswa ini?'))mut(()=>api('/students/'+id,'DELETE'));}
function resetS(id){if(confirm('Reset progres siswa ini?'))mut(()=>api('/students/'+id+'/reset','POST'));}
function tSoal(){const f=S.filter,list=D.qs.filter(q=>f==='all'||q.m===f);
 return `<div class="c f"><div class="k">TAMBAH SOAL</div>
 <div class="r"><div style="flex:1"><label for="qm">Mapel</label><select id="qm">${MK.map(m=>`<option value="${m}">${M[m][0]}</option>`).join('')}</select></div><div style="flex:1"><label for="qk">Kelas</label><select id="qk">${Object.entries(KL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
 <div><label for="qq">Pertanyaan</label><input id="qq"></div><div><label for="q0">Pilihan A</label><input id="q0"></div><div><label for="q1">Pilihan B</label><input id="q1"></div><div><label for="q2">Pilihan C</label><input id="q2"></div>
 <div><label for="qa">Jawaban benar</label><select id="qa"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></div>
 <div><label for="qe">Penjelasan (muncul setelah menjawab)</label><input id="qe"></div><button class="b" onclick="addQ()">Simpan soal</button></div>
 <div><label for="ff">Filter mapel (${list.length} soal)</label><select id="ff" onchange="S.filter=this.value;render()"><option value="all">Semua</option>${MK.map(m=>`<option value="${m}" ${f===m?'selected':''}>${M[m][0]}</option>`).join('')}</select></div>
 ${list.map(q=>`<div class="c"><div class="k">${dot(q.m)}${M[q.m][0].toUpperCase()} · ${KL[q.k]}</div><div style="margin:6px 0"><b>${esc(q.q)}</b></div><div class="m">${q.o.map((o,i)=>(i===q.a?'✓ ':'')+'ABC'[i]+'. '+esc(o)).join(' · ')}</div><button class="b g s d" style="margin-top:10px" onclick="delQ('${q.id}')">Hapus</button></div>`).join('')}`;}
function addQ(){const q=$('qq').value.trim(),o=[0,1,2].map(i=>$('q'+i).value.trim());if(!q||o.some(x=>!x)){alert('Lengkapi pertanyaan dan 3 pilihan.');return;}mut(()=>api('/questions','POST',{m:$('qm').value,k:$('qk').value,q,o,a:+$('qa').value,e:$('qe').value.trim()}));}
function delQ(id){if(confirm('Hapus soal ini?'))mut(()=>api('/questions/'+id,'DELETE'));}
function tLap(){const tot={};D.students.forEach(s=>MK.forEach(m=>{const b=s.st.by[m];if(b){const t=tot[m]=tot[m]||{n:0,c:0};t.n+=b.n;t.c+=b.c}}));
 const rows=MK.map(m=>{const t=tot[m]||{n:0,c:0},p=t.n?Math.round(t.c/t.n*100):0;return `<div><div class="r sp m"><span>${dot(m)}${M[m][0]}</span><span>${t.n?p+'% ('+t.n+' jawaban)':'belum ada data'}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const weak=MK.filter(m=>tot[m]&&tot[m].n).sort((a,b)=>tot[a].c/tot[a].n-tot[b].c/tot[b].n)[0];
 return `<div class="c f"><div class="k">AKURASI KELAS PER MAPEL</div>${rows}${weak?`<div class="m">Topik terlemah: <b style="color:var(--tx)">${M[weak][0]}</b></div>`:''}</div>
 <div class="c f"><div class="k">UBAH PIN GURU</div><div><label for="np">PIN baru</label><input id="np" type="password" inputmode="numeric"></div><button class="b" onclick="setPin()">Simpan PIN</button></div>
 `;}
function setPin(){const p=$('np').value.trim();if(p.length<4){alert('PIN minimal 4 karakter.');return;}mut(async()=>{await api('/teacher/pin','PUT',{pin:p});alert('PIN diperbarui.');});}
load().then(render).catch(()=>{$('app').innerHTML='<p style="padding:20px">Server belum terhubung. Jalankan: npm start</p>';});
</script></body></html>
